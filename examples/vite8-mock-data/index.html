<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vite-plugin-mock-data example</title>
</head>
<body>
  <h1>vite-plugin-mock-data</h1>
  <p>打开控制台，查看 fetch 请求结果。</p>
  <pre id="output">Loading...</pre>
  <script type="module">
    async function loadUsers() {
      const res = await fetch('/api/users');
      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
    loadUsers();
  </script>
</body>
</html>
